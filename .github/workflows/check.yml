name: Check notes and rebuild the homepage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Set up direct LaTeX web export
        run: sh notes/math/toolchain/scripts/setup_latex_web_ci.sh

      - name: Check the source policy, knowledge marker registry, and published web pages
        run: make check

  rebuild-homepage:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the homepage Pages build
        env:
          GH_TOKEN: ${{ secrets.HOMEPAGE_DISPATCH_TOKEN }}
        run: gh workflow run pages.yml --repo qiulinfan/qiulinfan.github.io
